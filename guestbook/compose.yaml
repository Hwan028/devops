services:
  # 문지기. 바깥 포트(8080)는 nginx만 열고 web 3개한테 나눠줌
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"          # 내맥 8080 → nginx 80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # ro = 읽기전용
    depends_on:
      web:
        condition: service_healthy

  web:
    build: .                   # Dockerfile로 빌드
    # ports 말고 expose. ports로 8080 열면 scale 3개 할때 포트 충돌남
    expose:
      - "5000"
    environment:
      APP_TITLE: "방명록"
      REDIS_HOST: "redis"       # IP 말고 서비스 이름! 도커 DNS가 찾아줌
      REDIS_PORT: "6379"
      # .env에서 읽어옴. 없으면 :? 뒤 메시지 띄우고 멈춤
      REDIS_PASSWORD: "${REDIS_PASSWORD:?비밀번호 설정 필요}"
    depends_on:
      redis:
        condition: service_healthy   # redis가 healthy 된 다음에 web 시작
    restart: unless-stopped    # 혼자 죽으면 다시 켬. 내가 stop한건 안켬
    # /readyz 열어서 응답 오면 정상. curl이 없어서 python으로
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    # compose watch 할때 app.py, templates 바뀌면 자동 rebuild
    develop:
      watch:
        - action: rebuild
          path: ./app.py
        - action: rebuild
          path: ./templates

  redis:
    image: redis:7-alpine
    # ports 없음 → 내 맥에서는 접속 X, 같은 네트워크 web만 접근 가능
    # appendonly yes = 디스크에도 기록
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data        # 컨테이너 지워도 데이터는 볼륨에 남음 (down -v 하면 삭제)
    # redis-cli ping → PONG 오면 정상
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
