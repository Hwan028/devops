server {
  # 컨테이너 안에서는 80번으로 받음 (밖에서는 compose ports 8080:80으로 연결)
  listen 80;

  # 127.0.0.11 = 도커 내부 DNS
  # valid=5s : 5초 지나면 web IP 다시 물어봄 (scale로 web 늘어나도 반영되게)
  resolver 127.0.0.11 valid=5s;

  location / {
    # 변수에 넣어서 써야 매번 DNS 다시 조회함
    # 그냥 proxy_pass http://web:5000; 하면 처음 IP만 기억할수 있음
    set $backend http://web:5000;
    proxy_pass $backend;
  }
}
